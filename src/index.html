.btn.del{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:13px}
/* pills */
.qi{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.55);margin-bottom:8px;border:1px solid transparent;transition:border .2s}
.qi.done{border-color:rgba(249,115,22,.25)}
.qi .n{width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--p2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:0 0 30px}
.qi .tx{flex:1;font-size:14px}
.pills{display:flex;gap:6px}
.pill{width:40px;height:34px;border-radius:999px;border:1px solid rgba(148,163,184,.4);background:rgba(255,255,255,.85);cursor:pointer;font:inherit;font-weight:500;transition:all .2s}
.pill:hover{transform:translateY(-2px);border-color:var(--p)}
.pill.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 6px 16px -4px rgba(249,115,22,.6)}
.cat{font-weight:600;font-size:14px;margin:16px 0 8px;color:var(--p2)}
/* progress */
.prog{height:12px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--line);overflow:hidden}
.prog>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--p));transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(250,204,21,.8)}
.sticky-prog{position:sticky;top:112px;z-index:10;padding:12px 18px;margin-bottom:18px;background:rgba(255,255,255,.92)}
/* score card */
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.score div{padding:16px;border-radius:20px;background:rgba(255,255,255,.6);text-align:center}
.score b{display:block;font-size:30px;font-weight:700;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{color:var(--muted)}
/* drop */
.drop{border:2px dashed rgba(249,115,22,.4);border-radius:22px;padding:18px;text-align:center;background:rgba(255,255,255,.45);cursor:pointer;transition:all .2s;position:relative;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.drop:hover,.drop.over{background:rgba(254,240,138,.35);border-color:var(--p);transform:translateY(-2px)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .x{position:absolute;top:8px;right:8px;z-index:2}
.drop.done{border:2px solid #22C55E;background:rgba(220,252,231,.55);box-shadow:0 0 0 4px rgba(34,197,94,.12)}
.dz-ok{position:absolute;left:10px;top:10px;z-index:3;background:#16A34A;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;box-shadow:0 4px 12px -2px rgba(22,163,74,.5);animation:dzok .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes dzok{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.drop .bar{position:absolute;left:12px;right:12px;bottom:10px;z-index:2}
/* table */
.tw{overflow:auto;border-radius:18px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;padding:6px 12px;white-space:nowrap}
td{background:rgba(255,255,255,.6);padding:10px 12px}
tr td:first-child{border-radius:14px 0 0 14px}tr td:last-child{border-radius:0 14px 14px 0}
tbody tr{transition:transform .2s}tbody tr:hover{transform:translateY(-2px)}
tbody tr:hover td{background:rgba(255,255,255,.9)}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:14px}
/* metric */
.metric{padding:18px;position:relative;overflow:hidden}
.metric .mi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(250,204,21,.25));box-shadow:0 0 22px rgba(249,115,22,.35)}
.metric b{display:block;font-size:30px;margin-top:10px;font-weight:700}
.metric small{color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dh{text-align:center;font-size:12px;color:var(--muted)}
.day{aspect-ratio:1/0.85;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);padding:8px;cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s;font-size:14px}
.day:hover{transform:translateY(-2px);box-shadow:var(--glowS)}
.day.sel{outline:2px solid var(--p)}
.day.off{opacity:.35;pointer-events:none}
.day.today b{color:var(--p2)}
.dot{position:absolute;bottom:8px;right:8px;width:10px;height:10px;border-radius:50%}
.dot.g{background:#22C55E;box-shadow:0 0 10px #22C55E}.dot.y{background:var(--a);box-shadow:0 0 10px var(--a)}.dot.o{background:var(--p2);box-shadow:0 0 12px var(--p2)}
.per{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc{padding:12px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid var(--line);cursor:pointer;transition:all .2s}
.pc:hover{transform:translateY(-2px)}
.pc.bk{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(250,204,21,.18));border-color:rgba(249,115,22,.4)}
.pc.mine{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.pc.lk{background:#F1F5F9;color:#94A3B8;cursor:not-allowed}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.55);cursor:pointer;font-size:13px;transition:all .2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(249,115,22,.6)}
/* modal */
.mask{position:fixed;inset:0;z-index:100;background:rgba(30,41,59,.25);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{width:min(980px,100%);max-height:92vh;overflow:auto;padding:22px;animation:min .35s cubic-bezier(.2,.8,.2,1)}
@keyframes min{from{opacity:0;transform:translateY(24px) scale(.97)}}
.embed{position:relative;padding-top:70%;border-radius:16px;overflow:hidden;background:#fff}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* loader */
#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(250,249,246,.55);backdrop-filter:blur(14px);transition:opacity .3s}
#loader.hide{opacity:0;pointer-events:none}
.ring{width:64px;height:64px;position:relative}
.ring::before,.ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:5px solid transparent}
.ring::before{border-top-color:var(--p);border-bottom-color:var(--p);animation:spin 1s linear infinite}
.ring::after{inset:10px;border-left-color:var(--a);border-right-color:var(--a);animation:spin 1.4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .glass{width:min(420px,100%);padding:32px}
/* signature */
.sigpad{width:100%;height:220px;border-radius:20px;background:rgba(255,255,255,.55);border:1px dashed rgba(249,115,22,.4);touch-action:none;cursor:crosshair}
.code{background:#1E293B;color:#FDE68A;padding:14px;border-radius:16px;font:12px/1.5 monospace;white-space:pre;overflow:auto;max-height:340px}
.acc-h{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.6);margin:10px 0 6px;font-weight:600}
.acc-h .c{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.acc-b{display:none}.acc-b.on{display:block}
.toast{position:fixed;right:20px;bottom:20px;z-index:9000;padding:12px 18px;border-radius:16px;background:rgba(30,41,59,.9);color:#fff;font-size:14px;animation:min .3s}
.foot{text-align:center;font-size:12px;line-height:1.7;color:var(--muted);padding:6px 0 10px}
.ver{display:inline-block;margin-top:6px;font-size:11px;color:var(--muted);opacity:.75;cursor:pointer;border-bottom:1px dotted currentColor}.ver:hover{opacity:1}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.per{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{padding:10px}
  .side{position:fixed;z-index:60;left:10px;top:10px;height:calc(100vh - 20px);transform:translateX(-120%);transition:transform .35s}
  .side.open{transform:none}.side.mini{width:272px}
  .mbtn{display:grid}
  .g2,.g3,.g4,.g5,.score{grid-template-columns:1fr 1fr}
  .qi{flex-wrap:wrap}.pills{width:100%;justify-content:space-between}
  .top{top:10px}.sticky-prog{top:88px}
}
@media (max-width:520px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.cal{gap:4px}.day{font-size:12px;padding:4px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.top,.btn,.mesh{display:none!important}}

function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function gasCall(fn,...args){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(r=>{try{res(typeof r==='string'?JSON.parse(r):r)}catch(e){res(r)}})
    .withFailureHandler(err=>{ const e=new Error(String(err&&err.message||err).replace(/^Error:\s{0,9}/,''));
      if(/AUTH_EXPIRED/.test(e.message)){ e.message=e.message.replace(/^AUTH_EXPIRED:\s{0,9}/,''); setTimeout(()=>logout(true),300); }
      rej(e); })[fn](...args);
  });
}
async function commit(ops){
  if(MODE==='gas') await gasCall('apiCommit', Store.token, JSON.stringify(ops));
  ops.forEach(o=>{
    if(o.c==='Settings'){ Store.settings = o.op==='merge'?{...Store.settings,...o.data}:o.data; return; }
    const c = Store.data[o.c] = Store.data[o.c]||{};
    if(o.op==='delete') delete c[o.id]; else { const d={...o.data}; delete d.newPass; c[o.id] = o.op==='merge'?{...(c[o.id]||{}),...d}:d; }
  });
  FS.mirror(ops);
}
async function busy(fn){ loader(true); try{ return await fn(); }catch(e){ SW.err('ไม่สำเร็จ', e.message); throw e; } finally{ loader(false); } }

function notis(){
  const u=Store.user, out=[];
  if(u.role==='Admin'||u.role==='Supervisor'){
    const p = Object.values(Store.data.LessonPlans).filter(x=>x.status==='รอประเมิน').length;
    if(p) out.push(`มีแผนรอประเมิน ${p} รายการ`);
    const today = ymd(new Date()); const b = Object.values(Store.data.Bookings).filter(x=>x.date===today && !x.is_locked).length;
    if(b) out.push(`วันนี้มีนัดนิเทศ ${b} คาบ`);
  } else {
    const mine = Object.values(Store.data.Bookings).filter(x=>x.teacher_id===u.username && x.date>=ymd(new Date())).sort((a,b)=>a.date.localeCompare(b.date));
    if(mine[0]) out.push(`นัดนิเทศถัดไป ${thDate(mine[0].date)} คาบ ${mine[0].period_no}`);
    const ev = Object.values(Store.data.Evaluations).length; if(ev) out.push(`คุณมีผลการประเมิน ${ev} รายการ`);
  }
  return out;
}

/* ================= Media helpers ================= */
function extractDriveId(u){ let m; u=u||''; if((m=u.match(/\/d\/([\w-]{10,})/)))return m[1]; if((m=u.match(/[?&]id=([\w-]{10,})/)))return m[1]; return ''; }
const driveImageUrl=(u,w=1600)=>{ if(/^data:/.test(u||'')) return u; const id=extractDriveId(u); return id?'https://lh3.googleusercontent.com/d/'+id+'=w'+w:(u||''); };
function drivePreview(u){ if(!u) return ''; if(/^data:|^blob:/.test(u)) return u; const id=extractDriveId(u); return id?'https://drive.google.com/file/d/'+id+'/preview':u; }
function viewPdf(url,title){ if(!url) return SW.err('ไม่มีไฟล์'); openModal(`<div class="row" style="margin-bottom:12px"><h3>${esc(title||'เอกสาร')}</h3><span class="sp"></span><a class="btn sm" href="${esc(url)}" target="_blank">เปิดแท็บใหม่</a><button class="btn sm" onclick="closeModal()">ปิด</button></div><div class="embed"><iframe src="${esc(drivePreview(url))}" loading="lazy" allowfullscreen></iframe></div>`); }

function compressImage(file, max=1600){
  return new Promise((res)=>{ if(!/^image[/]/.test(file.type)||/gif|svg/.test(file.type)) return res(file);
    const img=new Image(); img.onload=()=>{ let {width:w,height:h}=img; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      const png=/png|webp/.test(file.type);   /* PNG/WebP คงพื้นโปร่งใส ไม่แปลงเป็น JPEG (กันพื้นดำ) */
      c.toBlob(b=>res(new File([b],file.name.replace(/\.\w+$/,'')+(png?'.png':'.jpg'),{type:png?'image/png':'image/jpeg'})),png?'image/png':'image/jpeg',.85); URL.revokeObjectURL(img.src); };
    img.onerror=()=>res(file); img.src=URL.createObjectURL(file); });
}
async function uploadToDrive(file, onProgress, meta={}){
  const prog=onProgress||(()=>{});
  if(file.size>10*1024*1024) throw new Error('ไฟล์ใหญ่เกิน 10MB');
  if(MODE!=='gas'){ prog(100); return URL.createObjectURL(file); }
  prog(2);
  const b64=await new Promise((r,j)=>{const fr=new FileReader(); fr.onload=e=>r(e.target.result.split(',')[1]); fr.onerror=j; fr.readAsDataURL(file);});
  prog(8); let p=8; const t=setInterval(()=>{p=Math.min(92,p+(92-p)*.07);prog(p)},250);
  try{ const r=await gasCall('apiUpload',Store.token,JSON.stringify({filename:(meta.prefix||'')+file.name,mimeType:file.type||'application/octet-stream',data:b64,section:meta.section||'',sub:meta.sub||'',year:meta.year||''}));
    prog(100); return r.url; } finally{ clearInterval(t); }
}

  L.forEach(x=>{ if(x&&/^tf[0-9a-z]{2,12}$/.test(String(x.id||''))&&!out.some(o=>o.id===x.id)&&out.length<10) out.push({id:x.id,label:String(x.label||'').trim().slice(0,60)||'ไฟล์เอกสาร',type:TF_TYPES[x.type]?x.type:'pdf',on:x.on!==false,core:false}); });

const tfOn=()=>tfBlocks().filter(b=>b.on);
function tfUrl(p,id){ if(!p) return ''; const c=TF_CORE.find(d=>d.id===id); return c?(p[c.key]||''):((p.tfiles||{})[id]||''); }

function dropzone(key, label, accept, value){
  return `<div class="drop ${value?'done':''}" id="dz_${key}" data-key="${key}" data-accept="${accept}" data-label="${esc(label||'')}">
    ${value? `<span class="dz-ok">✓ อัปโหลดแล้ว</span>`+(accept.includes('image')?`<img src="${esc(driveImageUrl(value))}">`:`<div style="font-size:34px">📄</div><div style="color:#15803D;font-weight:600">ไฟล์ขึ้น Drive เรียบร้อย</div><button class="btn sm" onclick="event.stopPropagation();viewPdf('${esc(value)}')">เปิดดู</button>`)
      +`<button class="btn sm del x" onclick="event.stopPropagation();dzClear('${key}')">✕</button>`
    : `<div style="font-size:30px">${accept.includes('image')?'🖼️':'📎'}</div><b style="font-size:14px">${esc(label)}</b><div class="muted">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</div>`}
  </div>`;

const FORM = {};   // ค่าในฟอร์มปัจจุบัน
function bindDrops(meta){
  document.querySelectorAll('.drop[data-key]').forEach(dz=>{
    if(dz.dataset.b) return; dz.dataset.b=1;
    const key=dz.dataset.key, accept=dz.dataset.accept;
    const pick=()=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=()=>i.files[0]&&handle(i.files[0]); i.click(); };
    dz.onclick=pick;
    dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')}; dz.ondragleave=()=>dz.classList.remove('over');
    dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over'); const f=e.dataTransfer.files[0]; f&&handle(f);};
    async function handle(file){ const lb=dz.dataset.label||'';
      if(accept==='application/pdf' && file.type!=='application/pdf') return SW.err('รองรับเฉพาะไฟล์ PDF');
      if(accept.includes('image') && !/^image[/]/.test(file.type)) return SW.err('รองรับเฉพาะไฟล์ภาพ');
      const f = await compressImage(file);
      if(accept.includes('image')){ const pv=URL.createObjectURL(f); dz.innerHTML=`<img src="${pv}"><div class="bar"><div class="prog"><i></i></div></div>`; }
      else dz.innerHTML=`<div style="font-size:30px">⏳</div><div class="muted">${esc(file.name)}</div><div class="bar"><div class="prog"><i></i></div></div>`;
      const bar=dz.querySelector('.prog>i');
      try{ const url=await uploadToDrive(f,p=>bar.style.width=p+'%',typeof meta==='function'?meta(key):meta);
        discardUpload(FORM[key]); FORM[key]=url; dz.outerHTML=dropzone(key,lb,accept,url); bindDrops(meta); toast('อัปโหลดสำเร็จ'); }
      catch(e){ SW.err('อัปโหลดไม่สำเร็จ',e.message); dz.outerHTML=dropzone(key,lb||'ไฟล์',accept,''); bindDrops(meta); }
    }
  });
}
function discardUpload(url){ if(MODE!=='gas'||!url) return; const m=String(url).match(new RegExp('/d/([A-Za-z0-9_-]{20,})')); if(m) gasCall('apiDiscardUpload',Store.token,m[1]).catch(()=>{}); }
function dzClear(key){ discardUpload(FORM[key]); FORM[key]=''; const dz=$('#dz_'+key); const acc=dz.dataset.accept; dz.outerHTML=dropzone(key,dz.dataset.label||(acc.includes('image')?'แนบรูปภาพ':'แนบไฟล์ PDF'),acc,''); bindDrops(DZMETA); }

const H2P_URL=['https:','','cdnjs.cloudflare.com','ajax','libs','html2pdf.js','0.10.1','html2pdf.bundle.min.js'].join('/');
async function htmlToPdfB64(html){
  await loadScript(H2P_URL);
  html=await flattenImgs(html);
  const d=new DOMParser().parseFromString(html,'text/html');
  const css=[...d.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/@page\s*\{[^}]*\}/g,'')
    .replace(/(^|\})\s*([^{}@]+)\{/g,(m,a,sel)=>a+sel.split(',').map(x=>{x=x.trim(); return x==='body'?'.rp':'.rp '+x;}).join(',')+'{');
  const box=document.createElement('div');
  const reset='.rp table{border-collapse:collapse;border-spacing:0;font-size:inherit}.rp td,.rp th{white-space:normal;background-color:transparent;color:inherit}.rp th{font-weight:600}.rp td:first-child,.rp td:last-child,.rp th:first-child,.rp th:last-child{border-radius:0}.rp tbody tr,.rp tbody tr:hover{transform:none}';
  box.innerHTML='<style>'+reset+css+'.rp{margin:0!important}.rp table{max-width:100%}</style><div class="rp" style="width:708px;background:#fff">'+d.body.innerHTML+'</div>';
  box.style.cssText='width:718px;background:#fff';
  thaiBreaks(box);
  const SX=window.scrollX, SY=window.scrollY; window.scrollTo(0,0);
  try{
  try{ await document.fonts.ready; }catch(err){}
  const wk=html2pdf().set({margin:[8,10,8,10],image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:document.documentElement.clientWidth,windowHeight:document.documentElement.clientHeight},
    jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:[],before:[],after:[],avoid:[]}}).from(box);
  await wk.toContainer();
  try{ await document.fonts.ready; }catch(err){}
  await Promise.all([...wk.prop.container.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const cont=wk.prop.container, R=cont.getBoundingClientRect(), CW=R.width, PH=Math.floor(CW*281/190), at=[], fb=[], cat=[];
  cont.querySelectorAll('*').forEach(el=>{ const cs=getComputedStyle(el), r=el.getBoundingClientRect(), t=r.top-R.top, b=r.bottom-R.top;
    if(/always|page/.test(cs.breakBefore+' '+cs.pageBreakBefore)) fb.push(t);
    if(el.tagName==='TR'&&el.querySelector('td[colspan]')) cat.push([t,b]);
    if(r.height>0&&r.height<PH*0.9&&(el.tagName==='TR'||el.tagName==='IMG'||el.classList.contains('sum')||/avoid/.test(cs.breakInside+' '+cs.pageBreakInside))) at.push([t,b]); });
  const total=Math.ceil(R.height), cuts=[]; let s=0;
  while(s<total-2){ let lim=s+PH; const f=fb.filter(t=>t>s+5&&t<lim);
    if(f.length) lim=Math.min(...f);
    else if(lim<total){ const st=at.filter(x=>x[0]>s+5&&x[0]<lim&&x[1]>lim); if(st.length) lim=Math.min(...st.map(x=>x[0]));
      const c=cat.filter(x=>x[0]>s+5&&x[1]<=lim+1&&x[1]>=lim-3); if(c.length) lim=c[0][0]; }
    lim=Math.min(Math.floor(lim),total); cuts.push([s,lim]); s=lim; }
  const cv=await wk.toCanvas().get('canvas'), doc=await wk.toPdf().get('pdf'), k=cv.height/total, N0=doc.internal.getNumberOfPages();
  if(!cv.height||Math.abs(cv.height/total-cv.width/CW)/(cv.width/CW)>0.03) throw new Error('สร้าง PDF ไม่สมบูรณ์ (ภาพไม่ตรงขนาด) กรุณากดใหม่อีกครั้ง');
  cuts.forEach(([a,b])=>{ const c=document.createElement('canvas'); c.width=cv.width; c.height=Math.max(1,Math.round((b-a)*k)); const x=c.getContext('2d');
    x.fillStyle='#ffffff'; x.fillRect(0,0,c.width,c.height); x.drawImage(cv,0,Math.round(a*k),cv.width,c.height,0,0,cv.width,c.height);
    doc.addPage(); doc.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',10,8,190,(b-a)*190/CW); });
  for(let i=0;i<N0;i++) doc.deletePage(1);
  return doc.output('datauristring').split(',')[1];
  } finally { window.scrollTo(SX,SY); }
}
/* html2canvas ตัดคำไทยไม่เป็น → ข้อความหลายบรรทัดซ้อนทับ/หาย: แทรก zero-width space ระหว่างคำไทย */
function thaiBreaks(root){ if(typeof Intl==='undefined'||!Intl.Segmenter) return; const sg=new Intl.Segmenter('th',{granularity:'word'});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), L=[]; while(w.nextNode()) L.push(w.currentNode);
  L.forEach(n=>{ const t=n.nodeValue; if(!/[\u0E00-\u0E7F]/.test(t)||/^(STYLE|SCRIPT)$/.test((n.parentNode||{}).nodeName)) return;
    n.nodeValue=[...sg.segment(t.replace(/\u200B/g,''))].map(x=>x.segment).join('\u200B'); }); }
function flattenImgs(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  return Promise.all([...d.images].map(im=>new Promise(res=>{ const i=new Image(); i.crossOrigin='anonymous';
    i.onload=()=>{ try{ const w=Math.min(i.naturalWidth||600,1000), h=Math.round((i.naturalHeight||600)*w/(i.naturalWidth||600));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,w,h); x.drawImage(i,0,0,w,h);
      im.setAttribute('src',c.toDataURL('image/jpeg',0.9)); }catch(err){} res(); };
    i.onerror=()=>res(); i.src=im.getAttribute('src'); })))
    .then(()=>'<!DOCTYPE html>'+d.documentElement.outerHTML);
}

let AGW={A:40,B:30,C:30}, AGF={year:'',term:''};
function aggRows(){
  const E=Object.values(Store.data.Evaluations).filter(e=>(!AGF.year||e.year===AGF.year)&&(!AGF.term||e.term===AGF.term));
  return teachersIn(E).map(id=>{ const r={id,name:uname(id),n:0,evs:new Set()};
    ['A','B','C'].forEach(t=>{ const a=E.filter(e=>e.teacher_id===id&&e.type===t); r[t]=a.length?avg(a.map(e=>+e.total_normalized)):null; r['n'+t]=a.length; r.n+=a.length; a.forEach(e=>(e.evaluators||[]).forEach(v=>r.evs.add(v))); });
    const ws=['A','B','C'].filter(t=>r[t]!=null), wsum=ws.reduce((a,t)=>a+AGW[t],0);
    r.w = wsum?ws.reduce((a,t)=>a+r[t]*AGW[t],0)/wsum:0; r.grade=gradeOf(r.w); return r; }).sort((a,b)=>b.w-a.w);
}

AFTER.signature = ()=>{ initReveal(); FORM.sigfile='';

  const pt=e=>{const b=c.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top,p:e.pressure||.5}};
  c.onpointerdown=e=>{draw=true; last=pt(e); c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{ if(!draw) return; const p=pt(e); ctx.strokeStyle=$('#sigc').value; ctx.lineWidth=1.5+p.p*2.5; ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; sigDirty=true; };
  c.onpointerup=c.onpointercancel=()=>draw=false;
  bindDrops(()=>({section:'ลายเซ็น',sub:sigName(),prefix:'ลายเซ็น_'+sigName()+'_'}));

async function saBuildPdf(){
  if(MODE==='gas'&&(!SHORT||SHORT.loading||SHORT.err)){ try{ await loadShort(false); }catch(e){} SAGEN.qr=null; }
  try{ SAGEN.qr=SAGEN.qr||await qrDataUrl(saLink(),6); }catch(e){}
  const head=await htmlToPdfB64(saDocHtml());
  let man=null;
  if(MODE==='gas'){ try{ const r=await gasCall('apiSaManual',Store.token); if(r&&r.ok) man=r.data; }catch(e){} }
  if(!man) return {b64:head, manual:false};
  await loadScript(PDFLIB_URL());
  const out=await PDFLib.PDFDocument.load(b64ToBytes(head)), m=await PDFLib.PDFDocument.load(b64ToBytes(man));
  (await out.copyPages(m,m.getPageIndices())).forEach(p=>out.addPage(p));
  out.setTitle('ข้อมูลรหัสแอดมินโรงเรียน '+SAGEN.school);
  return {b64:await out.saveAsBase64(), manual:true};
}

const cellOf=(r,...keys)=>{ for(const k of keys){ const f=Object.keys(r).find(x=>x.trim()===k||x.trim().startsWith(k)); if(f!=null&&String(r[f]).trim()!=='') return String(r[f]).trim(); } return ''; };
async function readXlsx(file){
  if(!file) return; loader(true);
  try{
    const X=await xlsxLib(), wb=X.read(await file.arrayBuffer(),{type:'array'});
    const sh=n=>{ const k=wb.SheetNames.find(x=>x.trim()===n); return k?X.utils.sheet_to_json(wb.Sheets[k],{defval:''}):null; };
    const S=sh('โรงเรียน'), P=sh('ศน.'), T=sh('ครูและบุคลากร');
    if(!S&&!P&&!T) throw new Error('ไม่พบแผ่นงาน "โรงเรียน", "ศน." หรือ "ครูและบุคลากร" — ใช้ไฟล์ต้นแบบของระบบ');
    const schoolsIn=(S||[]).map(r=>({code:cellOf(r,'รหัสโรงเรียน'),name:cellOf(r,'ชื่อโรงเรียน'),size:cellOf(r,'ขนาด'),district:cellOf(r,'อำเภอ'),director:cellOf(r,'ผู้อำนวยการ'),note:cellOf(r,'หมายเหตุ')})).filter(x=>x.name);
    const known=new Set([...schoolsIn.map(x=>x.name),...schools()]);
    const warn=[], seen={}, usersIn=[];
    const add=(u,sheet,row)=>{ if(!u.username) return; if(/^\(ตัวอย่าง\)/.test(u.name)){ warn.push(`${sheet} แถว ${row}: ข้ามแถวตัวอย่าง (${u.username})`); return; }
      if(!Store.data.Users[u.username]){ const nm=normName(u.name), sup=u.role==='Supervisor';
        const m=users().find(x=>normName(x.name)===nm&&(sup?x.role==='Supervisor':(['Teacher','User'].includes(x.role)&&x.school===u.school)));
        if(m){ warn.push(`${sheet} แถว ${row}: "${u.name}" มีในระบบแล้ว (${m.username}) — อัปเดตคนเดิม ไม่สร้างซ้ำ และคงรหัสผ่านเดิม`); u.from=u.username; u.username=m.username; u.password=''; } }
      if(seen[u.username]){ warn.push(`${sheet} แถว ${row}: username ซ้ำ "${u.username}" (ใช้แถวล่าสุด)`); }
      if(u.school&&!known.has(u.school)) warn.push(`${sheet} แถว ${row}: ไม่พบโรงเรียน "${u.school}"`);
      (u.schools||[]).forEach(x=>{ if(!known.has(x)) warn.push(`${sheet} แถว ${row}: ไม่พบโรงเรียน "${x}"`); });
      seen[u.username]=u; };
    (P||[]).forEach((r,i)=>add({username:cleanUn(cellOf(r,'username')),password:cellOf(r,'รหัสผ่าน'),name:cellOf(r,'ชื่อ-สกุล'),position:cellOf(r,'ตำแหน่ง')||'ศึกษานิเทศก์',rank:cellOf(r,'วิทยฐานะ'),
      role:cellOf(r,'บทบาท')?roleOfRow(cellOf(r,'บทบาท'),''):'Supervisor',school:'',schools:cellOf(r,'โรงเรียนที่รับผิดชอบ').split(/[,，\n]/).map(x=>x.trim()).filter(Boolean),status:'active'},'ศน.',i+2));
    (T||[]).forEach((r,i)=>add({username:cleanUn(cellOf(r,'username')),password:cellOf(r,'รหัสผ่าน'),name:cellOf(r,'ชื่อ-สกุล'),position:cellOf(r,'ตำแหน่ง'),rank:cellOf(r,'วิทยฐานะ'),
      group:cellOf(r,'กลุ่มสาระ'),school:cellOf(r,'ชื่อโรงเรียน'),role:roleOfRow(cellOf(r,'บทบาท'),cellOf(r,'ตำแหน่ง')),status:({'ใช้งาน':'active','ระงับ':'suspended'})[cellOf(r,'สถานะ')]||cellOf(r,'สถานะ')||'active'},'ครูและบุคลากร',i+2));
    Object.values(seen).forEach(u=>usersIn.push(u));
    const exist=usersIn.filter(u=>Store.data.Users[u.username]).length;
    IMP={file:file.name,schools:schoolsIn,users:usersIn,warn,exist,replace:false};
  }catch(e){ SW.err('อ่านไฟล์ไม่สำเร็จ',e.message); IMP=null; }
  finally{ loader(false); render(); }
}

async function pdfSelfTest(){ const R=[]; let last='';
  const html=await busy(()=>docHtml('result'));
  for(let i=1;i<=3;i++){ const t0=performance.now();
    try{ const b=await busy(()=>htmlToPdfB64(html)); const txt=atob(b); const pages=(txt.match(/\/Type\s*\/Page[^s]/g)||[]).length;
      R.push({i,ok:true,pages,kb:Math.round(b.length*0.75/1024),ms:Math.round(performance.now()-t0)}); last=b; }
    catch(err){ R.push({i,ok:false,msg:err.message||String(err),ms:Math.round(performance.now()-t0)}); } }
  const good=R.filter(r=>r.ok), same=good.length===3&&new Set(good.map(r=>r.pages)).size===1&&Math.max(...good.map(r=>r.kb))-Math.min(...good.map(r=>r.kb))<=Math.max(5,good[0].kb*0.03);
  const rows=R.map(r=>`<tr><td>รอบ ${r.i}</td><td>${r.ok?'✅':'❌'}</td><td>${r.ok?r.pages+' หน้า':''}</td><td>${r.ok?r.kb+' KB':esc(r.msg)}</td><td>${(r.ms/1000).toFixed(1)} วิ</td></tr>`).join('');
  const msg=`<table style="width:100%;font-size:13.5px;border-collapse:collapse">${rows}</table><div style="margin-top:12px;text-align:left;font-size:13.5px">${same?'✅ <b>ผ่าน</b> ทั้ง 3 รอบได้ผลเท่ากัน':'⚠️ <b>ไม่ผ่าน</b> ผลแต่ละรอบไม่เท่ากัน (อาจยังมีอาการ render ไม่ครบ)'}<br>ให้เปิดไฟล์ที่ดาวน์โหลดแล้วดูว่า ข้อความในตารางไม่ซ้อนกัน และแถวไม่ถูกตัดครึ่งหน้า</div>`;
  if(last) saveBlob(new Blob([b64ToBytes(last)],{type:'application/pdf'}),'ทดสอบ_เอกสารผลการประเมิน_'+ymd(new Date())+'.pdf');
  if(window.Swal) Swal.fire({title:'ผลทดสอบสร้าง PDF',html:msg,icon:same?'success':'warning',confirmButtonText:'ปิด',confirmButtonColor:getCss('--p')}); else alert(same?'ผ่าน':'ไม่ผ่าน'); }

async function certCanvas(html){ await loadScript(H2P_URL);
  const wrap=document.createElement('div'), box=document.createElement('div'); wrap.style.cssText='position:fixed;left:-99999px;top:0;width:1123px;height:794px';
  box.style.cssText='width:1123px;height:794px;background:#ffffff'; box.innerHTML=html; wrap.appendChild(box); document.body.appendChild(wrap);
  try{ try{ await document.fonts.ready; }catch(err){}
    const wk=html2pdf().set({margin:0,image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}}).from(box);
    const cv=await wk.toCanvas().get('canvas'); return {wk,cv}; } finally{ wrap.remove(); } }
async function certPdf(htmls,onP){ let doc=null, N0=0;
  for(let i=0;i<htmls.length;i++){ const {wk,cv}=await certCanvas(htmls[i]);
    if(!doc){ doc=await wk.toPdf().get('pdf'); N0=doc.internal.getNumberOfPages(); }
    doc.addPage(); doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210); if(onP) onP(i+1); }
  for(let i=0;i<N0;i++) doc.deletePage(1);
  return new Uint8Array(doc.output('arraybuffer')); }

async function docxLib(){ if(!window.docx) await loadScript(DOCX_URL); if(!window.JSZip) await loadScript(JSZIP_URL); return window.docx; }
async function addThaiCs(blob){
  const zip=await JSZip.loadAsync(blob), THAI=new RegExp('[\\u0E00-\\u0E7F]');
  for(const name of Object.keys(zip.files).filter(n=>new RegExp('^word.(document|header\\d*|footer\\d*)\\.xml$').test(n))){
    let xml=await zip.file(name).async('string');
    xml=xml.replace(new RegExp('<w:r(?:\\s[^>]*)?>[\\s\\S]*?</w:r>','g'),r=>{
      if(!THAI.test(r.replace(new RegExp('<[^>]+>','g'),''))||r.indexOf('<w:cs/>')>=0) return r;
      const end=r.indexOf('</w:rPr>');
      if(end<0){ if(r.indexOf('<w:rPr/>')>=0) return r.replace('<w:rPr/>','<w:rPr><w:cs/></w:rPr>'); return r.replace(new RegExp('^(<w:r(?:\\s[^>]*)?>)'),'$1<w:rPr><w:cs/></w:rPr>'); }
      const m=r.slice(0,end).match(new RegExp('<w:(em|lang|eastAsianLayout|specVanish|oMath|rPrChange)\\b')); const at=m?m.index:end;
      return r.slice(0,at)+'<w:cs/>'+r.slice(at); });
    zip.file(name,xml); }
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

  ov.addEventListener('click',e=>{ const a=e.target.dataset.a; if(a==='skip') endTour(); else if(a==='prev') tourGo(TR.i-1); else if(a==='next') TR.i>=TR.steps.length-1?endTour():tourGo(TR.i+1); });
  TR.key=e=>{ if(e.key==='Escape') endTour(); else if(e.key==='ArrowRight') TR.i<TR.steps.length-1&&tourGo(TR.i+1); else if(e.key==='ArrowLeft') TR.i>0&&tourGo(TR.i-1); };
  TR.rs=()=>tourGo(TR.i,true); addEventListener('keydown',TR.key); addEventListener('resize',TR.rs);
  requestAnimationFrame(()=>{ ov.classList.add('on'); tourGo(0); });
}
function tourGo(i,quiet){ if(!TR) return; i=Math.max(0,Math.min(TR.steps.length-1,i)); TR.i=i;
  const [sel,h,d]=TR.steps[i], el=document.querySelector(sel); if(!el) return;
  if(!quiet) el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(()=>{ if(!TR) return; const r=el.getBoundingClientRect(), pad=8, hole=TR.ov.querySelector('.tour-hole'), tip=TR.ov.querySelector('.tour-tip');
    Object.assign(hole.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    tip.querySelector('.tt-n').textContent=(i+1)+' / '+TR.steps.length; tip.querySelector('h4').textContent=h; tip.querySelector('p').textContent=d;
    tip.querySelector('.tt-dots').innerHTML=TR.steps.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('');
    tip.querySelector('[data-a=prev]').style.visibility=i?'visible':'hidden';
    tip.querySelector('[data-a=next]').textContent=i===TR.steps.length-1?'เริ่มใช้งาน ✓':'ถัดไป →';
    const tw=Math.min(340,innerWidth-24), th=tip.offsetHeight||170; let x, y;
    if(r.right+pad+16+tw<innerWidth){ x=r.right+pad+16; y=r.top+r.height/2-th/2; }
    else if(r.bottom+pad+16+th<innerHeight){ x=r.left+r.width/2-tw/2; y=r.bottom+pad+16; }
    else { x=r.left+r.width/2-tw/2; y=r.top-pad-16-th; }
    x=Math.max(12,Math.min(innerWidth-tw-12,x)); y=Math.max(12,Math.min(innerHeight-th-12,y));
    Object.assign(tip.style,{width:tw+'px',transform:'translate('+x+'px,'+y+'px)'}); tip.classList.remove('pop'); void tip.offsetWidth; tip.classList.add('pop');
  }, quiet?0:260);
}
function endTour(silent){ if(!TR) return; const t=TR; TR=null; removeEventListener('keydown',t.key); removeEventListener('resize',t.rs);
  t.ov.classList.remove('on'); setTimeout(()=>t.ov.remove(),450); if(!silent) ls.set(tourKey(),String(Date.now())); if(innerWidth<=820) $('#side')&&$('#side').classList.remove('open'); }

   <div class="foot">ออกแบบระบบ โดย ดร.ปิยะพันธ์ พิชญ์ประเสริฐ<br>พัฒนาระบบ โดย นนทพัทธ์ หิรัญเรือง<br><span class="ver" onclick="showChangelog()" title="ดูประวัติอัปเดต">เวอร์ชัน ${APP_VERSION}</span></div></div>`;
  if(matchMedia('(hover:hover)').matches && !matchMedia('(prefers-reduced-motion:reduce)').matches)
    document.querySelectorAll('.pcard').forEach(c=>{ let raf=0;
      c.addEventListener('pointermove',e=>{ const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
        if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; c.style.setProperty('--mx',x*100+'%'); c.style.setProperty('--my',y*100+'%');
          c.style.setProperty('--rx',((.5-y)*10).toFixed(2)+'deg'); c.style.setProperty('--ry',((x-.5)*10).toFixed(2)+'deg'); }); });
      c.addEventListener('pointerleave',()=>{ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); }); });
}
function loginView(portal){
  const sa=portal==='schooladmin'; if(sa) portal='admin';
  if(!portal||!PORTALS[portal]) return landingView();
  const s=Store.settings||{}, si=s.school_info||{}, P=sa?{...PORTALS.admin,t:'แอดมินโรงเรียน',roles:['SchoolAdmin']}:PORTALS[portal];
  Store.portal=portal;
  $('#root').innerHTML=`<div class="login"><div class="glass reveal in">
   <button class="btn sm ghost" onclick="landingView()" style="margin-bottom:6px">← เลือกส่วนงานอื่น</button>
   <div style="text-align:center;margin-bottom:20px"><div class="pcard" style="padding:0;display:inline-block;box-shadow:none;background:none;border:0;cursor:default"><div class="pi" style="margin:0 auto 12px">${PORTAL_SVG[sa?'admin':portal]||icon(P.ic)}</div></div>
    <div class="muted" style="font-size:12px">เข้าสู่ระบบสำหรับ</div><h2 style="font-size:22px">${esc(P.t)}</h2><div class="muted">${esc(si.name||'')}</div></div>
   <form onsubmit="event.preventDefault();doLogin()" class="grid"><label class="f">ชื่อผู้ใช้<input id="l_u" autocomplete="username" required></label>
    <label class="f">รหัสผ่าน<input id="l_p" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" style="justify-content:center;padding:12px">เข้าสู่ระบบ</button></form>
   ${MODE==='demo'?`<div class="muted" style="margin-top:14px;text-align:center">โหมดทดลอง: ${portal==='teacher'?'t1':portal==='supervisor'?'sup1':'admin / sa1'} (รหัสอะไรก็ได้)</div>`:''}
   <div class="muted" style="margin-top:10px;text-align:center;font-size:12px">ส่วนนี้สำหรับบทบาท: ${P.roles.map(roleTh).join(' / ')}</div>
   <div class="foot" style="margin-top:14px">ออกแบบระบบ โดย ดร.ปิยะพันธ์ พิชญ์ประเสริฐ<br>พัฒนาระบบ โดย นนทพัทธ์ หิรัญเรือง</div></div></div>`;
  setTimeout(()=>{ const i=$('#l_u'); i&&i.focus(); },50);
}
async function doLogin(){
  const u=val('l_u'), p=$('#l_p').value;
  try{ loader(true);
    const portal=Store.portal;
    if(MODE!=='gas'){ const du=demoData().Users[u]; if(du && !PORTALS[portal].roles.includes(du.role)) throw new Error('บัญชีนี้เป็น '+roleTh(du.role)+' — กรุณาเข้าสู่ระบบที่การ์ด "'+PORTALS[ROLE_PORTAL[du.role]].t+'"'); }
    let r; if(MODE==='gas') r=await gasCall('apiLogin',u,p,portal); else r=demoLogin(u);
    Store.token=r.token; saveTok(r.token); await enter(r, true);
  }catch(e){ loader(false); SW.err('เข้าสู่ระบบไม่สำเร็จ',e.message); }
}
async function enter(r, fresh){
  Store.user=r.user;
  let pt = Store.portal || ss.get('portal');
  if(!pt || !PORTALS[pt] || !PORTALS[pt].roles.includes(r.user.role)) pt = ROLE_PORTAL[r.user.role] || 'teacher';
  Store.portal=pt; ss.set('portal',pt); Store.settings=r.data.settings||Store.settings; ['Users','Evaluations','LessonPlans','Bookings','Schools','Surveys'].forEach(k=>Store.data[k]=r.data[k]||{});
  applyTheme(Store.settings.theme); await FS.init(); shell(); go(ss.get('view')||(r.user.role==='User'?'schooldash':'dashboard')); loader(false); maybeTour();
}
async function logout(silent){
  if(!silent && !(await SW.confirm('ออกจากระบบ?'))) return;
  if(MODE==='gas'&&Store.token) gasCall('apiLogout',Store.token).catch(()=>{});
  endTour(true); FS.stop(); ls.del('tok'); ls.del('tok_t'); ss.del('tok'); ss.del('view'); ss.del('portal'); Store.user=null; Store.portal=''; landingView();
}

/* ================= Reveal ================= */
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target);} }),{threshold:.08}):null;
function initReveal(){ if(!io||matchMedia('(prefers-reduced-motion:reduce)').matches){ document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in')); return; }
  document.querySelectorAll('.reveal:not([data-rv])').forEach(el=>{ el.dataset.rv=1; io.observe(el); }); }

(async function start(){
  if(window.APP_BOOT&&APP_BOOT.survey){ if(Store.settings) applyTheme(Store.settings.theme); loader(false); return svPublicView(); }
  if(Store.settings) applyTheme(Store.settings.theme); else Store.settings=demoData().settings;
  const tok=getTok(), want=(window.APP_BOOT&&APP_BOOT.portal)||new URLSearchParams(location.search).get('p')||'';
  if(MODE==='gas' && tok){ try{ Store.token=tok; const r=await gasCall('apiResume',tok); return enter(r); }catch(e){ ls.del('tok'); ls.del('tok_t'); } }

})();
